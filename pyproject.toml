[tool.poetry]
name = "pcds-dap"
version = "0.1.0"
description = "Streaming OPeNDAP service for PCIC station data"
authors = ["Pacific Climate Impacts Consortium"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "pcds_dap", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = ">=2.0"
psycopg2 = ">=2.9.10,<3"
pycds = { git = "https://github.com/pacificclimate/pycds.git", branch = "improved-station-query" }
pydap = { git = "https://github.com/pydap/pydap.git", branch = "main" }
sqlalchemy = ">=2.0,<3"
starlette = ">=0.47,<1"
uvicorn = { version = ">=0.35,<1", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1"
pytest = ">=8.4,<9"
ruff = ">=0.12,<1"

[tool.poetry.scripts]
pcds-dap = "pcds_dap.__main__:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
