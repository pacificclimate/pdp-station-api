name: Documentation Container

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Test portal importer
        run: python3 -m unittest discover -s docs -p test_import_portal.py

      - name: Import pinned portal guide
        run: python3 docs/import_portal.py

      - name: Build documentation
        run: sphinx-build -d docs/_build/doctrees -b html --fail-on-warning --keep-going docs/source docs/_build/html

      - name: Read API version
        id: version
        run: |
          version=$(sed -n '/^\[tool\.poetry\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' pyproject.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: pcic/pdp-station-api-docs
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=api-${{ steps.version.outputs.version }}-docs-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Station Data API documentation
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build serving image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docs/_build/html
          file: docker/docs.Dockerfile
          load: true
          tags: pdp-station-api-docs:check
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            API_VERSION=${{ steps.version.outputs.version }}
            DOCS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

      - name: Check Nginx serves the guide
        run: |
          docker run -d --name docs-check pdp-station-api-docs:check
          trap 'docker rm -f docs-check' EXIT
          for attempt in $(seq 1 20); do
            if docker exec docs-check wget -q -O /dev/null http://127.0.0.1/; then
              break
            fi
            sleep 1
          done
          for page in index portal/root stations programmatic aggregate compatibility faq contributing search; do
            docker exec docs-check wget -q -O /dev/null "http://127.0.0.1/$page.html"
          done
          docker exec docs-check wget -q -O /dev/null http://127.0.0.1/searchindex.js

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.pcicdevops_at_dockerhub_username }}
          password: ${{ secrets.pcicdevops_at_dockerhub_password }}

      - name: Publish documentation image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docs/_build/html
          file: docker/docs.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            API_VERSION=${{ steps.version.outputs.version }}
            DOCS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=docs
