[tool.poetry]
name = "pdp-station-api"
version = "0.1.0"
description = "Streaming OPeNDAP service for PCIC station data"
authors = ["Pacific Climate Impacts Consortium"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "pdp_station", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = ">=2.0"
h5netcdf = ">=1.6,<2"
h5py = ">=3.12,<4"
psycopg2 = ">=2.9.10,<3"
pycds = { git = "https://github.com/pacificclimate/pycds.git", branch = "improved-station-query" }
pydap = { git = "https://github.com/pydap/pydap.git", branch = "main" }
sqlalchemy = ">=2.0,<3"
shapely = ">=2.1,<3"
starlette = ">=0.47,<1"
uvicorn = { version = ">=0.35,<1", extras = ["standard"] }
xlsxwriter = ">=3.2,<4"
rustpy-xlsxwriter = ">=0.5,<0.6"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1"
openpyxl = ">=3.1,<4"
pytest = ">=8.4,<9"
ruff = ">=0.12,<1"

[tool.poetry.scripts]
pdp-station-api = "pdp_station.__main__:main"

[tool.poetry.plugins."pydap.response"]
nc = "pdp_station.responses:NetCDFResponse"
xlsx = "pdp_station.responses:XLSXResponse"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
